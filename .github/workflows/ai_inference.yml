name: AI Inference in GitHub Actions

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LANG: ja_JP.UTF-8
  TZ: Asia/Tokyo

# $ npx @pkgdeps/update-github-actions-permissions ".github/workflows/*.{yaml,yml}"
permissions:
  contents: read

jobs:
  ai_inference:
    name: AI Inference in GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: $ git clone する
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.80
      # https://github.com/actions/ai-inference
      - name: AI Inference in GitHub Actions
        id: inference
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        with:
          prompt: 'こんにちは！'
          model: ''
        env:
          # 無指定や secrets.GITHUB_TOKEN では権限が不足しておりエラーになる
          COPILOT_GITHUB_TOKEN: ${{ secrets.MY_PAT }}
      - name: Print Output
        id: output
        run: echo "${{ steps.inference.outputs.response }}"
      - name: Use Response File
        run: |
          echo "Response saved to: ${{ steps.inference.outputs.response-file }}"
          cat "${{ steps.inference.outputs.response-file }}"
